# ISB Development Environment Configuration
# Load from environment variables or use defaults
ENVIRONMENT=ISB_DEV
APP_URL=${APP_URL_ISB_DEV:-http://localhost:3000}
API_BASE_URL=${API_BASE_URL_ISB_DEV:-http://localhost:4000/api}
BROWSER=${BROWSER:-chromium}
HEADLESS=${HEADLESS:-false}
TIMEOUT=${TIMEOUT:-30000}
RETRY_COUNT=${RETRY_COUNT:-2}
LOG_LEVEL=${LOG_LEVEL:-debug}
DB_HOST=${DB_HOST_ISB_DEV:-localhost}
DB_PORT=${DB_PORT:-5432}
DB_NAME=${DB_NAME_ISB_DEV:-test_db}
REPORT_FORMAT=${REPORT_FORMAT:-html,json}
